:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0b0f19;color:#f2f4f8;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
#schloss{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
.karte{width:100%;max-width:360px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px 22px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 18px;color:#a9b1c3;font-size:14px;line-height:1.45}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:inherit;outline:none}
input[type=password]:focus{border-color:#3b82f6}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:#a9b1c3;margin:12px 0 16px}
button{width:100%;font:inherit;font-weight:600;font-size:15px;padding:12px;border:0;border-radius:12px;background:linear-gradient(90deg,#2563eb,#22d3ee);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
.fehler{color:#f87171;font-size:13px;min-height:18px;margin-top:10px}

  var KEY = 'apps-schloss:' + S.salt;
  function u8(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function b64(a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function entschluesseln(raw) {

  /* Der Schlüssel bleibt im Fenster, damit die App verschlüsselte Zusatzdateien (z. B. fotos.bin) öffnen kann */
  function anzeigen(html, raw) {
    function los() { window.__appSchluessel = raw; document.open(); document.write(html); document.close(); window.__appSchluessel = raw; }
    if (document.readyState === 'complete') setTimeout(los, 0); else window.addEventListener('load', function () { setTimeout(los, 0); });

  var gemerkt = null;
  try { gemerkt = localStorage.getItem(KEY); } catch (e) {}
